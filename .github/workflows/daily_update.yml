name: Oregon FQHC Snapshot Pipeline

on:
  # Schedule: Run at 14:00 UTC every Monday (approx 6am/7am Oregon time)
  schedule:
    - cron: '0 14 * * 1'
  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

concurrency:
  group: production-fqhc-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      UV_PYTHON_PREFERENCE: only-managed
      EXPECTED_RUNNER_OS: Linux
      EXPECTED_RUNNER_ARCH: X64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production runner
        run: |
          test "$RUNNER_OS" = "$EXPECTED_RUNNER_OS"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          enable-cache: false

      - name: Install pinned Python
        run: uv python install 3.13.16

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Verify interpreter and select Quarto Python
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path
          import sys
          from scripts.validate_dev import verify_platform
          verify_platform()
          assert sys.version_info[:3] == (3, 13, 16), "Unexpected Python version"
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"QUARTO_PYTHON={sys.executable}\n")
          PY

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"

      - name: Verify Quarto version
        run: test "$(quarto --version)" = "$(cat .quarto-version)"

      - name: Build validated 2024 analytical snapshot
        run: |
          uv run --locked python projects/oregon-fqhc/scripts/run_pipeline.py

      # --- NEW STEP: QUALITY GATE ---
      - name: Run Quality Assurance Tests
        run: |
          uv run --locked python -m pytest -p no:cacheprovider projects/oregon-fqhc/tests/
          uv run --locked python projects/oregon-fqhc/scripts/4_analyze_correlations.py
      # ------------------------------

      - name: Render Quarto Site
        run: |
          uv run --locked quarto render
          uv run --locked python -c 'from pathlib import Path; from scripts.validate_dev import verify_website; verify_website(Path.cwd())'

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs projects/oregon-fqhc/data/raw/hrsa_sites.xlsx projects/oregon-fqhc/data/raw/uds_2024.xlsx projects/oregon-fqhc/data/processed
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Automated Data Update & Site Re-build"
          git push
