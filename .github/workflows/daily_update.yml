name: Oregon FQHC Snapshot Pipeline

on:
  # Schedule: Run at 14:00 UTC every Monday (approx 6am/7am Oregon time)
  schedule:
    - cron: '0 14 * * 1'
  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Caching makes future runs faster

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build validated 2024 analytical snapshot
        run: |
          python projects/oregon-fqhc/scripts/run_pipeline.py

      # --- NEW STEP: QUALITY GATE ---
      - name: Run Quality Assurance Tests
        run: |
          python -m pytest -p no:cacheprovider projects/oregon-fqhc/tests/
          python projects/oregon-fqhc/scripts/4_analyze_correlations.py
      # ------------------------------

      - name: Render Quarto Site
        run: |
          quarto render

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs projects/oregon-fqhc/data/raw/hrsa_sites.xlsx projects/oregon-fqhc/data/raw/uds_2024.xlsx projects/oregon-fqhc/data/processed
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Automated Data Update & Site Re-build"
          git push
